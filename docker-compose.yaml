services:
  db:
    build:
      context: .
      dockerfile: ./docker-build/db/Dockerfile
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: django_app_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  redis:
    image: redis:8.4-alpine
    ports:
      - "6379:6379"
